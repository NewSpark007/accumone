<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accumone Tech | Course Enrollment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">ACCUMONE <span style="font-weight: 300; color: #70def4;">TECH</span></div>
        <div class="nav-links">
            <a href="index.html"class="contact-nav">Home</a>
            <a href="dept.html"class="contact-nav">Departments</a>
            <a href="about.html"class="contact-nav">About Us</a>
            <a href="contact.html" class="contact-nav">Contact Us</a>
        </div>
    </nav>

    <div class="container">
        <div style="text-align: center; margin-bottom: 40px;">
            <h1 class="gradient-text">Course Enrollment</h1>
            <p style="color: var(--text-dim);">Begin your journey in Fashion Technology & Engineering.</p>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <form id="enrollForm">
                <div style="margin-bottom: 20px;">
                    <label style="display:block; color: var(--cyan-glow); margin-bottom: 8px;">Full Name</label>
                    <input type="text" id="studentName" placeholder="Enter your full name" required 
                           style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; color: var(--cyan-glow); margin-bottom: 8px;">Email Address</label>
                    <input type="email" id="studentEmail" placeholder="email@example.com" required 
                           style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; color: var(--cyan-glow); margin-bottom: 8px;">Select Department</label>
                    <select id="courseSelect" required 
                            style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white;">
                        <option value="">-- Choose a Field --</option>
                        <option value="software">Software Engineering</option>
                        <option value="ai">AI & Data Science</option>
                        <option value="cyber">Cybersecurity</option>
                        <option value="cloud">Cloud & DevOps</option>
                        <option value="emerging">Emerging Tech</option>
                        <option value="fusion">3D Industrial Modeling (Fusion 360)</option>
                        <option value="web3">Digital Assets & Web3 (NEFT)</option>
                        <option value="autocad">Technical Pattern Engineering (AutoCAD)</option>
                    </select>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display:block; color: var(--cyan-glow); margin-bottom: 8px;">Education Background</label>
                    <textarea id="background" rows="3" placeholder="Briefly describe your experience..." 
                              style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white;"></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; font-size: 1rem;">
                    Submit Enrollment Application
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
